<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo King Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .menu-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
        button {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="menu-box">
        <h1>🎲 Ludo King Online</h1>
        <p>Welcome! Create or join private rooms to play.</p>
        <button onclick="alert('Offline Mode Coming Soon!')">Play Offline</button>
        <button onclick="alert('Private Room Feature Coming Soon!')">Create Room</button>
    </div>

</body>
</html>
